name: Deploy عوافي to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site (task app at root, expenses app at /expenses)
        run: |
          mkdir -p _site
          cp -r "the task app/." _site/
          mkdir -p _site/expenses
          cp -r "monthly-expenses-app/." _site/expenses/
          rm -f _site/expenses/make_icons.py
      - name: Upload the assembled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
