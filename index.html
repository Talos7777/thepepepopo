<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Summer To-Dos — one thing at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    /* --- summer / carton palette --- */
    --sky:       #6cbdec;
    --sky-light: #a9e0f7;
    --sky-deep:  #2f8fc9;
    --cream:     #fbf3e0;
    --paper:     #fffdf6;
    --ink:       #3a4653;
    --ink-soft:  #7f8b97;
    --coral:     #ef5b43;
    --coral-deep:#d33f2b;
    --sun:       #f8c53c;
    --sun-deep:  #e9a400;
    --grass:     #7cb84e;
    --grass-deep:#5e9c37;
    --peach:     #f4a98a;
    --line:      #eadfc4;

    --radius: 20px;
    --font-display: 'Fredoka', 'M PLUS Rounded 1c', sans-serif;
    --font: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background-color: var(--cream);
    /* graph-paper texture, like the carton */
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 90px;
  }

  /* ---------- Summer scene header (the "cover art") ---------- */
  .scene {
    position: relative;
    margin: 0 -16px;
    line-height: 0;
  }
  .scene svg { width: 100%; height: auto; display: block; }

  /* Title band below the art — like the game cover / carton name band */
  .band {
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: 0 0 var(--radius) var(--radius);
    margin: -2px 0 26px;
    padding: 16px 20px 18px;
    text-align: center;
    box-shadow: 0 5px 0 rgba(58,70,83,.12);
  }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--coral);
    color: #fff;
    font-family: var(--font);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .5px;
    padding: 3px 12px;
    border-radius: 999px;
    transform: rotate(-1.5deg);
    box-shadow: 0 2px 0 var(--coral-deep);
  }
  .greeting {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.15;
    margin: 10px 0 2px;
    color: var(--ink);
  }
  .greeting .kana { color: var(--sky-deep); }
  .sub { color: var(--ink-soft); font-size: 14px; font-weight: 500; }

  /* ---------- Quick add ---------- */
  .quickadd {
    display: flex; gap: 10px; align-items: center;
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 9px 9px 9px 18px;
    box-shadow: 0 4px 0 rgba(58,70,83,.14);
    margin-bottom: 30px;
  }
  .quickadd input {
    flex: 1; border: none; background: transparent;
    color: var(--ink); font-family: var(--font);
    font-size: 16px; font-weight: 500; outline: none;
  }
  .quickadd input::placeholder { color: var(--ink-soft); }
  .add-btn {
    flex-shrink: 0;
    border: 2.5px solid var(--ink);
    background: var(--coral); color: #fff;
    width: 44px; height: 44px; border-radius: 14px;
    font-size: 26px; font-weight: 700; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
  }
  .add-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

  /* ---------- Section labels ---------- */
  .label {
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 4px 12px;
  }
  .label .en {
    font-family: var(--font-display); font-weight: 700;
    font-size: 15px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ink);
  }
  .label .jp { font-size: 13px; font-weight: 700; color: var(--coral); }
  .label .count {
    margin-left: auto; font-size: 13px; font-weight: 700;
    color: var(--ink-soft);
  }

  /* ---------- Right Now (hero) ---------- */
  .now-card {
    position: relative;
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 26px 22px 22px;
    box-shadow: 0 5px 0 rgba(58,70,83,.14);
    margin-bottom: 34px;
    overflow: hidden;
  }
  /* coral wavy banner along the top, like the milk carton */
  .now-card .wave { position: absolute; top: 0; left: 0; right: 0; height: 14px; display: block; }
  .now-title {
    font-family: var(--font-display); font-weight: 600;
    font-size: 22px; line-height: 1.25; margin: 8px 0 16px;
  }
  .now-empty { color: var(--ink-soft); font-size: 15px; text-align: center; padding: 10px 4px; }
  .now-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: var(--font); font-weight: 700; font-size: 14px;
    border: 2.5px solid var(--ink);
    background: var(--paper); color: var(--ink);
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s, background .15s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--grass); color: #fff; }
  #focusTimerBtn { background: var(--sky); color: #fff; }

  /* ---------- Focus timer ---------- */
  .timer {
    display: none; align-items: center; gap: 12px;
    margin-top: 18px; padding-top: 16px;
    border-top: 2px dashed var(--line);
  }
  .timer.show { display: flex; }
  .timer-time {
    font-family: var(--font-display); font-weight: 700;
    font-size: 26px; font-variant-numeric: tabular-nums; color: var(--sky-deep);
  }
  .timer .muted { color: var(--ink-soft); font-size: 13px; font-weight: 500; }

  /* ---------- Task list (kept calm & quiet on purpose) ---------- */
  ul { list-style: none; }
  .task {
    display: flex; align-items: center; gap: 13px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 13px 15px; margin-bottom: 10px;
    transition: border-color .2s, opacity .3s, transform .2s;
  }
  .task.focused { border-color: var(--sky); box-shadow: 0 3px 0 rgba(108,189,236,.35); }
  .check {
    width: 25px; height: 25px; flex-shrink: 0;
    border: 2.5px solid var(--ink-soft); border-radius: 50%;
    cursor: pointer; display: grid; place-items: center;
    transition: background .2s, border-color .2s, transform .12s;
  }
  .check:hover { border-color: var(--grass); }
  .check:active { transform: scale(.88); }
  .check svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3.5; fill: none; opacity: 0; transition: opacity .15s; }
  .task.done .check { background: var(--grass); border-color: var(--grass); }
  .task.done .check svg { opacity: 1; }
  .task.done .task-text { color: var(--ink-soft); text-decoration: line-through; }
  .task-text { flex: 1; font-size: 16px; font-weight: 500; word-break: break-word; }
  .icon-btn {
    background: none; border: none; cursor: pointer; padding: 4px;
    font-size: 17px; line-height: 1; transition: opacity .15s, transform .12s;
  }
  .focus-star { color: var(--sun-deep); opacity: .55; }
  .focus-star:hover { opacity: 1; transform: scale(1.2); }
  .task.focused .focus-star { opacity: 1; }
  .del { color: var(--ink-soft); opacity: 0; }
  .task:hover .del { opacity: .55; }
  .del:hover { opacity: 1; }

  .empty-list { text-align: center; color: var(--ink-soft); padding: 28px 0; font-size: 15px; font-weight: 500; }

  /* ---------- Celebrate toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(120px);
    background: var(--ink); color: var(--paper);
    font-weight: 700; font-size: 15px;
    padding: 12px 24px; border-radius: 999px;
    border: 2.5px solid var(--ink);
    box-shadow: 0 4px 0 rgba(58,70,83,.25);
    opacity: 0; pointer-events: none;
    transition: transform .35s cubic-bezier(.2,.9,.3,1.3), opacity .3s;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
  <div class="app">

    <!-- ===== Cover art: a classic sky ===== -->
    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5cb2e6"/>
            <stop offset="1" stop-color="#bfe7f7"/>
          </linearGradient>
          <clipPath id="round"><rect x="0" y="0" width="640" height="150" rx="20" ry="20"/></clipPath>
        </defs>

        <g clip-path="url(#round)">
          <!-- sky -->
          <rect x="0" y="0" width="640" height="150" fill="url(#sky)"/>

          <!-- soft classic clouds -->
          <g fill="#ffffff">
            <g opacity=".98">
              <ellipse cx="150" cy="60" rx="58" ry="30"/>
              <ellipse cx="108" cy="74" rx="40" ry="24"/>
              <ellipse cx="196" cy="76" rx="44" ry="22"/>
              <rect x="104" y="68" width="96" height="24" rx="12"/>
            </g>
            <g opacity=".92">
              <ellipse cx="440" cy="40" rx="50" ry="27"/>
              <ellipse cx="480" cy="52" rx="38" ry="22"/>
              <ellipse cx="406" cy="54" rx="32" ry="19"/>
            </g>
            <g opacity=".82">
              <ellipse cx="560" cy="104" rx="52" ry="26"/>
              <ellipse cx="606" cy="112" rx="36" ry="19"/>
              <ellipse cx="516" cy="114" rx="30" ry="16"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <!-- ===== Title band ===== -->
    <div class="band">
      <span class="tag">☀ なつやすみ気分 · take it easy</span>
      <div class="greeting" id="greeting">Good afternoon.</div>
      <div class="sub">One small thing at a time. 🌻</div>
    </div>

    <!-- ===== Quick add ===== -->
    <div class="quickadd">
      <input id="input" type="text" placeholder="Catch a thought… type it here" autocomplete="off" />
      <button class="add-btn" id="addBtn" title="Add">+</button>
    </div>

    <!-- ===== Right Now ===== -->
    <div class="label">
      <span class="en">Right Now</span>
      <span class="jp">いま、これ</span>
    </div>
    <div class="now-card">
      <svg class="wave" viewBox="0 0 640 14" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,8 C60,0 100,14 160,8 C220,2 260,14 320,8 C380,2 420,14 480,8 C540,2 580,14 640,8 L640,0 L0,0 Z" fill="#ef5b43"/>
      </svg>
      <div id="nowContent">
        <div class="now-empty">No focus task yet — tap the ☆ on any task to bring it up here.</div>
      </div>
      <div class="timer" id="timer">
        <span class="timer-time" id="timerTime">05:00</span>
        <button class="btn" id="timerToggle">Start</button>
        <span class="muted">Just 5 minutes. That's it.</span>
      </div>
    </div>

    <!-- ===== List ===== -->
    <div class="label">
      <span class="en">Today's Catch</span>
      <span class="jp">やること</span>
      <span class="count" id="count"></span>
    </div>
    <ul id="list"></ul>
    <div class="empty-list" id="emptyList" style="display:none">
      All clear — nothing to catch right now. 🌱
    </div>

  </div>

  <div class="toast" id="toast">Nice. That's momentum. 🎉</div>

<script>
  const CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';
  const PRAISE = ["Nice. That's momentum. 🎉","Done! Keep it rolling. 🌟","One less thing. 💪","You did that. ✨","Boom. Next? 🚀","Caught it! 🦋"];

  let state = load();
  const $ = (id) => document.getElementById(id);
  const input = $('input');

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem('momentum') || '{}');
      return Array.isArray(raw.tasks) ? { tasks: raw.tasks, focusId: raw.focusId ?? null } : { tasks: [], focusId: null };
    } catch { return { tasks: [], focusId: null }; }
  }
  function save() { localStorage.setItem('momentum', JSON.stringify(state)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function addTask(text) {
    text = text.trim();
    if (!text) return;
    state.tasks.unshift({ id: uid(), text, done: false });
    save(); render();
  }
  function toggle(id) {
    const t = state.tasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    if (t.done) { if (state.focusId === id) state.focusId = null; celebrate(); }
    save(); render();
  }
  function del(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    if (state.focusId === id) state.focusId = null;
    save(); render();
  }
  function setFocus(id) {
    state.focusId = state.focusId === id ? null : id;
    save(); render();
  }

  function celebrate() {
    const toast = $('toast');
    toast.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    toast.classList.add('show');
    clearTimeout(celebrate._t);
    celebrate._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function render() {
    const active = state.tasks.filter(t => !t.done);
    const focus = state.tasks.find(t => t.id === state.focusId && !t.done);

    const nc = $('nowContent');
    if (focus) {
      nc.innerHTML = `
        <div class="now-title">${esc(focus.text)}</div>
        <div class="now-actions">
          <button class="btn primary" data-done="${focus.id}">✓ Done</button>
          <button class="btn" id="focusTimerBtn">⏱ Focus 5 min</button>
          <button class="btn" data-unfocus="1">Clear focus</button>
        </div>`;
    } else {
      nc.innerHTML = `<div class="now-empty">No focus task yet — tap the ☆ on any task to bring it up here.</div>`;
      $('timer').classList.remove('show');
      resetTimer();
    }

    const list = $('list');
    list.innerHTML = '';
    const ordered = [...active, ...state.tasks.filter(t => t.done)];
    ordered.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '') + (t.id === state.focusId ? ' focused' : '');
      li.innerHTML = `
        <div class="check" data-toggle="${t.id}">${CHECK_SVG}</div>
        <div class="task-text">${esc(t.text)}</div>
        ${t.done ? '' : `<button class="icon-btn focus-star" data-focus="${t.id}" title="Focus on this">${t.id === state.focusId ? '★' : '☆'}</button>`}
        <button class="icon-btn del" data-del="${t.id}" title="Remove">✕</button>`;
      list.appendChild(li);
    });

    $('count').textContent = active.length ? `${active.length} left` : 'all clear ☀';
    $('emptyList').style.display = state.tasks.length ? 'none' : 'block';
  }

  function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- Timer ----
  let timerSec = 300, timerRunning = false, timerInt = null;
  function fmt(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
  function resetTimer() { clearInterval(timerInt); timerRunning = false; timerSec = 300; const tt = $('timerTime'); if (tt) tt.textContent = fmt(timerSec); const tg = $('timerToggle'); if (tg) tg.textContent = 'Start'; }
  function toggleTimer() {
    if (timerRunning) { clearInterval(timerInt); timerRunning = false; $('timerToggle').textContent = 'Resume'; return; }
    timerRunning = true; $('timerToggle').textContent = 'Pause';
    timerInt = setInterval(() => {
      timerSec--; $('timerTime').textContent = fmt(timerSec);
      if (timerSec <= 0) { clearInterval(timerInt); timerRunning = false; celebrate(); resetTimer(); }
    }, 1000);
  }

  // ---- Events ----
  $('addBtn').addEventListener('click', () => { addTask(input.value); input.value = ''; input.focus(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { addTask(input.value); input.value = ''; } });

  document.body.addEventListener('click', e => {
    const t = e.target.closest('[data-toggle],[data-del],[data-focus],[data-done],[data-unfocus],#focusTimerBtn,#timerToggle');
    if (!t) return;
    if (t.dataset.toggle) toggle(t.dataset.toggle);
    else if (t.dataset.del) del(t.dataset.del);
    else if (t.dataset.focus) setFocus(t.dataset.focus);
    else if (t.dataset.done) toggle(t.dataset.done);
    else if (t.dataset.unfocus) setFocus(state.focusId);
    else if (t.id === 'focusTimerBtn') { $('timer').classList.add('show'); }
    else if (t.id === 'timerToggle') toggleTimer();
  });

  // Greeting by time of day (with a little kana accent)
  (function () {
    const h = new Date().getHours();
    let en = 'Good evening.', jp = 'こんばんは';
    if (h < 12) { en = 'Good morning.'; jp = 'おはよう'; }
    else if (h < 18) { en = 'Good afternoon.'; jp = 'こんにちは'; }
    $('greeting').innerHTML = `${en} <span class="kana">${jp}</span>`;
  })();

  render();
  input.focus();
</script>
</body>
</html>
